<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setMilliseconds() Method</h2>
<p>setMilliseconds() sets the milliseconds of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setMilliseconds(192);
document.getElementById("demo").innerHTML = d.getMilliseconds();
</script>

</body>
</html>
