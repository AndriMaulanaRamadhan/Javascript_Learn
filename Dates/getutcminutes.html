<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCMinutes() Method</h2>

<p>getUTCMinutes() returns the minutes of a date, according to UTC:</p>

<p id="demo"></p>

<script>
const d = new Date();
let minutes = d.getUTCMinutes();
document.getElementById("demo").innerHTML = minutes;
</script>

</body>
</html>
