<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Dates</h2>

<p>Date.UTC() returns the number of milliseconds between a date and January 1, 1970, according to UTC:</p>

<p id="demo"></p>

<script>
let ms = Date.UTC(2020, 2, 30);
document.getElementById("demo").innerHTML = ms;
</script>

</body>
</html>
