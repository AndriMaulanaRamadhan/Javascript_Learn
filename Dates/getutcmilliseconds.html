<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCMilliseconds() Method</h2>

<p>getUTCMilliseconds() returns the milliseconds of a date:</p>

<p id="demo"></p>

<script>
const d = new Date();
let ms = d.getUTCMilliseconds();
document.getElementById("demo").innerHTML = ms;
</script>

</body>
</html>
