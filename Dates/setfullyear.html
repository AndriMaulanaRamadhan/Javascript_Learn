<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setFullYear() Method</h2>
<p>setFullYear() sets the year of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setFullYear(2020);
document.getElementById("demo").innerHTML = d;
</script>

</body>
</html>
