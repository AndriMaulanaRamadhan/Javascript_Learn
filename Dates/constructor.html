<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The constructor Property</h2>

<p>The constructor property returns the function that created the Date prototype:</p>

<p id="demo"></p>

<script>
const d = new Date();
let text = d.constructor;

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
