<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCFullYear() Method</h2>

<p>getUTCFullYear() returns the year of a date, according to UTC:</p>

<p id="demo"></p>

<script>
const d = new Date();
let year = d.getUTCFullYear();
document.getElementById("demo").innerHTML = year;
</script>

</body>
</html>
