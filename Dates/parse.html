<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Dates</h2>

<p>parse() parses a date string and returns the number of milliseconds since midnight January 1, 1970:</p>

<p id="demo"></p>

<script>
let ms = Date.parse("March 21, 2012");
document.getElementById("demo").innerHTML = ms;
</script>

</body>
</html>
