<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCDate() Method</h2>

<p>getUTCDate() returns the day of the month of a date, according to UTC:</p>

<p id="demo"></p>

<script>
const d = new Date();
let day = d.getUTCDate();
document.getElementById("demo").innerHTML = day;
</script>

</body>
</html>
