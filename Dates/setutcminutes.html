<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setUTCMinutes() Method</h2>
<p>setUTCMinutes() sets the minutes (according to UTC time) of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setUTCMinutes(17);
document.getElementById("demo").innerHTML = d;
</script>

</body>
</html>
