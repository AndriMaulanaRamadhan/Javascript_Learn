<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCSeconds() Method</h2>

<p>getUTCSeconds() returns the seconds of a Date, according to universal time:</p>

<p id="demo"></p>

<script>
const d = new Date();
let seconds = d.getUTCSeconds();
document.getElementById("demo").innerHTML = seconds;
</script>

</body>
</html>
