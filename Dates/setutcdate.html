<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setUTCDate() Method</h2>
<p>setUTCDate() sets the date (according to UTC) of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setUTCDate(25);
document.getElementById("demo").innerHTML = d;
</script>

</body>
</html>
