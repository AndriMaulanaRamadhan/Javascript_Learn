<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getSeconds() Method</h2>

<p>getSeconds() returns the seconds of a date:</p>

<p id="demo"></p>

<script>
const d = new Date();
let seconds = d.getSeconds();
document.getElementById("demo").innerHTML = seconds;
</script>

</body>
</html>
