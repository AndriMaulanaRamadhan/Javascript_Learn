<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setUTCFullYear() Method</h2>
<p>setUTCFullYear() sets the year (according UTC) of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setUTCFullYear(2015);
document.getElementById("demo").innerHTML = d;
</script>

</body>
</html>
