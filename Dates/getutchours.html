<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Dates</h1>
<h2>The getUTCHours() Method</h2>

<p>getUTCHours() returns the hour of a date, according to UTC:</p>

<p id="demo"></p>

<script>
const d = new Date();
let hour = d.getUTCHours();
document.getElementById("demo").innerHTML = hour;
</script>

</body>
</html>
