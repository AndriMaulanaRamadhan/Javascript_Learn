<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Dates</h1>
<h2>The setUTCHours() Method</h2>
<p>setUTCHours() method sets the hour (according to UTC) of a date object.</p>

<p id="demo"></p>

<script>
const d = new Date("2025-01-15");
d.setUTCHours(15);
document.getElementById("demo").innerHTML = d;
</script>

</body>
</html>
