<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Booleans</h1>
<h2>The toString() Method</h2>
<p>The toString() method converts a boolean to a string:</p>

<p id="demo"></p>

<script>
let bool = true;
let text = bool.toString(); 
document.getElementById("demo").innerHTML = text + " " + typeof text;
</script>

</body>
</html>
