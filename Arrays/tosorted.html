<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Arrays</h1>
<h2>The toSorted() Method</h2>
<p>The toSorted() method sorts the elements of an array in alphabetical order.</p>

<p id="demo"></p>

<script>
// Create an Array
const fruits = ["Banana", "Orange", "Apple", "Mango"];

// Sort the Array
const fruits2 = fruits.toSorted();

// Display the New Array
document.getElementById("demo").innerHTML = fruits + "<br>" + fruits2;
</script>

</body>
</html>
