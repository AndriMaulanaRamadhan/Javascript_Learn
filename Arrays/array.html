<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Arrays</h1>
<h2>The [] Array Constructor</h2>

<p>An array stores multiple values in a single variable:</p>

<p id="demo"></p>

<script>
// Create an Array
const cars = ["Saab", "Volvo", "BMW"];
document.getElementById("demo").innerHTML = cars;
</script>

</body>
</html>
