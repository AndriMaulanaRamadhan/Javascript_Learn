<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Arrays</h1>
<h2>The includes() Method</h2>

<p>includes() returns true if an array contains a specified element:</p>

<p id="demo"></p>

<script>
const fruits = ["Banana", "Orange", "Apple", "Mango"];
document.getElementById("demo").innerHTML = fruits.includes("Mango");
</script>

<p>includes() is not supported in Edge 13 (or earlier).</p>

</body>
</html>
