<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Maps</h1>
<h2>The set() Method</h2>

<p id="demo"></p>

<script>
// Create a Map
const fruits = new Map();

// Set Map Values
fruits.set("apples", 500);
fruits.set("bananas", 300);
fruits.set("oranges", 200);

// Get the Value of "apples"
let x = fruits.get("apples")
document.getElementById("demo").innerHTML = "The value of apples is " + x;
</script>

</body>
</html>
