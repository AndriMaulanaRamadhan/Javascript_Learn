<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The sort() Method</h2>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int32Array.of(40, 100, 1, 5, 25, 10);

// Sort the Array
myArr.sort();

// Display the Array
document.getElementById("demo").innerHTML = myArr;
</script>

</body>
</html>
