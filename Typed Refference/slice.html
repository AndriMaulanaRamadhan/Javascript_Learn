<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The slice() Method</h2>

<p>slice() returns selected array elements as a new array:</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30,35,40,45,50]);

// Slice the Array
const newArr = myArr.slice(2);

document.getElementById("demo").innerHTML = newArr;
</script>

</body>
</html>
