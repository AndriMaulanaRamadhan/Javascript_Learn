<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The subarray() Method</h2>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int32Array.of(40, 100, 1, 5, 25, 10);

// Create a Subarray
subArr = myArr.subarray(2);

// Display the Subarray
document.getElementById("demo").innerHTML = subArr;
</script>

</body>
</html>
