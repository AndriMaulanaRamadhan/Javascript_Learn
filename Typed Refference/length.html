<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The length Property</h2>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = new Int32Array(10);

// Get the array length
let text = myArr.length;
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
