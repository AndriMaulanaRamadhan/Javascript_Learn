<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The set() Method</h2>

<p>set() stores values in a typed array from another array.</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30,35,40,45,50]);

// Set new Values
myArr.set([1,2,3]);

document.getElementById("demo").innerHTML = myArr;
</script>

</body>
</html>
