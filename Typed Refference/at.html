<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The at() Method</h2>

<p>The at() method returns an indexed element from a typed array.</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int32Array.of(10,20,30,40,50,60);
let myNumber = myArr.at(0);

document.getElementById("demo").innerHTML = "The value of the element with index 0 is: " + myNumber;
</script>

</body>
</html>
