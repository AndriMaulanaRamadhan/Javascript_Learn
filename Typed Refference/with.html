<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The with() Method</h2>

<p>The with() method updates a specified array element.</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30]);

// Create a new Array
const newArr = myArr.with(2, 10);

document.getElementById("demo").innerHTML = newArr;
</script>

</body>
</html>
