<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The keys() Method</h2>

<p>keys() returns an Iterator with the keys of a typed array:</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30,35,40,45,50]);

// Create an Iterable
const list = myArr.keys();
 
// List the Keys
let text = "";
for (let x of list) {
  text += x + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
