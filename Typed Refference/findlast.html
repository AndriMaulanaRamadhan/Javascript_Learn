<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The findLast() Method</h2>

<p>The last element with a value over 18 is:</p>
<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30,35,40,45,50]);

// Find the last element with a value over 18
let result = myArr.findLast(x => x > 18);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
