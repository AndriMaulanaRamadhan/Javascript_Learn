<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The join() Method</h2>

<p>join() returns all array elements as a string:</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30,35,40,45,50]);

// Join the Array
let text = myArr.join(" ");

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
