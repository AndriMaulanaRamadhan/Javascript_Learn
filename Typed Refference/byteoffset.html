<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The byteOffset Property</h2>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = new Int32Array(10);

// Get the byte offset
let text = myArr.byteOffset;

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
