<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Typed Arrays</h1>
<h2>The values() Method</h2>

<p>values() returns an iterator object with the values of a typed array.</p>

<p id="demo"></p>

<script>
// Create a Typed Array
const myArr = Int16Array.from([10,15,20,25,30]);

// Create an Iterator
const list = myArr.values();

// List the Values
let text = "";
for (let x of list) {
  text += x + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
