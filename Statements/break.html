<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Statements</h1>
<h2>The break Statement</h2>

<p>The loop is supposed to output 0 to 4, but the break statement exits the loop when i == 3:</p>

<p id="demo"></p>

<script>
let text = "";
for (let i = 0; i < 5; i++) {
  if (i == 3) break;
  text += i + "<br>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
