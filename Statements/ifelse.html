<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Statements</h1>
<h2>The if Statement</h2>

<p>Display "Good day"if the hour is less than 20:00:</p>

<p id="demo"></p>

<script>
let hour = new Date().getHours();
if (hour < 20) {
  document.getElementById("demo").innerHTML = "Good day";
}
</script>

</body>
</html>
