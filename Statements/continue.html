<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Statements</h1>
<h2>The continue Statement</h2>

<p>Loop through a block of code, but skip the value 3:</p>

<p id="demo"></p>

<script>
let text = "";
for (let i = 0; i < 5; i++) {
  if (i === 3) continue;
  text += i + "<br>";
}
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
