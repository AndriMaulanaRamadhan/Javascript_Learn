<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \P Metacharacter</h2>

<p>Match any character that is NOT a lowercase letter:</p>

<p id="demo"></p>

<script>
let text1 = "A";
let text2 = "a";
let pattern = /\P{Lowercase_Letter}/u;

result1 = pattern.test(text1);
result2 = pattern.test(text2);

document.getElementById("demo").innerHTML = text1 + " is " + result1 + ", " + text2 + " is " + result2;
</script>

</body>
</html>
