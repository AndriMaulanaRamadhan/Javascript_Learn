<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The . Metacharacter</h2>

<p>A global search for any character between h and t:</p>

<p id="demo"></p>

<script>
let text = "That's hot!";
let pattern = /h.t/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
