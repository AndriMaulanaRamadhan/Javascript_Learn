<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \f Metacharacter</h2>

<p>Find the position where a form feed character is found:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools.\fLearn JavaScript."; 
let pattern = /\f/;
let result = text.search(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
