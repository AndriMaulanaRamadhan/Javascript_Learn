<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \r Metacharacter</h2>

<p>Find the position where a carriage return character is found:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools.\rLearn JavaScript."; 
let pattern = /\r/;
let result = text.search(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
