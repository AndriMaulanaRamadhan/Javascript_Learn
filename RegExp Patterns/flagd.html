<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /d Flag</h2>
<p>Match everything that start or end with aa or bb:</p>
<p id="demo"></p>

<script>
let text = "aaaabb"; 
let result = text.match(/(aa)(bb)/d);
document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
