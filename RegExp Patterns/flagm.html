<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /m Flag</h2>

<p>Do a multiline search for "is" at the beginning of each line in a string:</p>

<p id="demo"></p>

<script>
let text = `Is this
all there
is`

let pattern = /^is/m;
let result = text.match(pattern);
document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
