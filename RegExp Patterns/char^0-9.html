<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>Using [ ] to find a range of characters</h2>

<p>A global search for numbers that are NOT from 1 to 4:</p>

<p id="demo"></p>

<script>
let text = "123456789";
let pattern = /[^1-4]/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
