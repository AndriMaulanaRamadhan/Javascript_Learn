<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>Using [] to find a character</h2>

<p>A global search for the characters different from W:</p>

<p id="demo"></p>

<script>
let text = "This is W3Schools";
let pattern = /[^W]/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
