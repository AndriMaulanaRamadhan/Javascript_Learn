<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /y Flag</h2>
<p>The /y flag must be set to allow match from a position.</p>

<p id="demo"></p>

<script>
let text = "abc def ghi";
let pattern = /\w+/y;

// Start match from position 4
pattern.lastIndex = 4;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
