<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \S Metacharacter</h2>

<p>A search for non-whitespace characters:</p>

<p id="demo"></p>

<script>
let text = "Is this all there is?";
let pattern = /\S/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
