<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /v Flag</h2>

<p>The /v flag is an "upgrade" to the /u flag. It enables more Unicode-related features.</p>

<p id="demo"></p>

<script>
let text = "Hello 😄";

let pattern = /\p{RGI_Emoji}/v;
let result = pattern.test(text);
document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
