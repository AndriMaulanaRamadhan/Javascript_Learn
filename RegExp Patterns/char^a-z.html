<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>Using [] to find a range of characters</h2>

<p>A global search for characters NOT in the range from A to Z:</p>

<p id="demo"></p>

<script>
let text = "This is W3Schools";
let pattern = /[^A-Z]/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
