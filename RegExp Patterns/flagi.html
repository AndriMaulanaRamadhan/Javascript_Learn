<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /i Flag</h2>

<p>Perform a case-insenitive match:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools";
let pattern = /w3schools/i;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
