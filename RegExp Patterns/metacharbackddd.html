<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \ddd Metacharacters</h2>

<p>A global search the octal number 127 (W):</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools. Hello World!"; 
let pattern = /\127/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
