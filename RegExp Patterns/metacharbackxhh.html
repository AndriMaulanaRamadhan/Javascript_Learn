<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The \xhh Metacharacters</h2>

<p>A global search for the hexadecimal number 57 (W) in a string:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools. Hello World!"; 
let pattern = /\x57/g;
let result = text.match(pattern);

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
