<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Objects</h1>
<h2>The constructor Property</h2>

<p id="demo"></p>

<script>
const person = {
  firstName: "John",
  lastName: "Doe",
  age: 50,
  eyeColor: "blue"
};

let text = person.constructor;
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
