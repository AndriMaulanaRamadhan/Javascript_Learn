<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Objects</h1>
<h2>The Object.create() Method</h2>

<p>Create a new object from the prototype of another object.</p>

<p id="demo"></p>

<script>
// Create an Object:
const person = {
  firstName: "John",
  lastName: "Doe",
  language: "EN"
};

// Create new Object
const man = Object.create(person);
man.firstName = "Peter";

// Display Properties
document.getElementById("demo").innerHTML = person.firstName + " and " + man.firstName;
</script>

</body>
</html>
