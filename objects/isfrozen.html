<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Objects</h1>
<h2>The Object.isFrozen() Method</h2>

<p id="demo"></p>

<script>
// Create Object
const person = {firstName:"John", lastName:"Doe"};

// Freeze Object
Object.freeze(person);

let text = Object.isFrozen(person);
document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
