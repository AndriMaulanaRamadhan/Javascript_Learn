<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Objects</h1>
<h2>The Object.defineProperty() Method</h2>

<p>This example changes a property value.</p>

<p id="demo"></p>

<script>
// Create an object:
const person = {
  firstName: "John",
  lastName: "Doe",
  language: "EN" 
};

// Change a property
Object.defineProperty(person, "language", {value:"NO"})

// Display Property
document.getElementById("demo").innerHTML = person.language;
</script>

</body>
</html>
