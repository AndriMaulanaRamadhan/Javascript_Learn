<!DOCTYPE html>
<html>
<body>

<h1>JavaScript Strings</h1>
<h2>The at() Method</h2>

<p>The at() method returns an indexed character from a string.</p>

<p id="demo"></p>

<script>
let text = "W3schools";
let character = text.at(0);

document.getElementById("demo").innerHTML = character;
</script>

</body>
</html>
