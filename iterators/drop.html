<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Iterators</h1>
<h2>The drop() Method</h2>

<p>The drop() method returns a new iterator with a specified number of elements skipped.</p>

<p id="demo"></p>

<script>
// Create an iterator
const myIterator = Iterator.from([1, 2, 3, 4, 5, 6, 7, 8, 9]);

// Drop the first five
const firstFive = myIterator.drop(5);

// Iterate over the new iterator
let text = "";
for (const x of firstFive) {
  text += x + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
