<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Iterators</h1>
<h2>The take() Method</h2>

<p>The take() method returns an iterator with a specified number of elements.</p>

<p id="demo"></p>

<script>
// Create an iterator
const myIterator = Iterator.from([1, 2, 3, 4, 5, 6, 7, 8, 9]);

// Take the first five
const firstFive = myIterator.take(5);

// Iterate over the new elements
let text = "";
for (const x of firstFive) {
  text += x + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
