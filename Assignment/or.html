<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Assignments</h1>
<h2>Logical OR Assignment</h2>
<h2>The ||= Operator</h2>

<p>If the first value is false, the second value is assigned.</p>

<p id="demo"></p>

<script>
let x = false;
x ||= 10;

document.getElementById("demo").innerHTML = "x is: " + x;
</script>

</body>
</html>
