<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Operators</h1>
<h2>The Logical AND Operator</h2>
<h2>The && Operator</h2>

<p>The && operator returns true if both expressions are true, otherwise false:</p>

<p id="demo"></p>

<script>
let x = 6;
let y = 3;
let result = (x < 10 && y > 1);

document.getElementById("demo").innerHTML = "Result is " + result 
</script>

</body>
</html>
