<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Operators</h1>
<h2>The NOT Operator</h2>
<h3>The ! Operator</h3>

<p>The NOT operator returns true for a false expression and false for a true expression:</p>

<p id="demo1"></p>
<p id="demo2"></p>

<script>
let x1 = !(5 === 5);
let x2 = !(5 === 8);

document.getElementById("demo1").innerHTML = "!(5 === 5) is " + x1;
document.getElementById("demo2").innerHTML = "!(5 === 8) is " + x2;
</script>

</body>
</html>
