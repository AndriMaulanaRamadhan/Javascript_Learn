<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Comparison</h1>
<h2>Strict Not Equal</h2>
<h2>The !== Operator</h2>

<p>Assign 5 to x, and return the value of the comparison (x !== 5):</p>

<p id="demo"></p>

<script>
let x = 5;
let result = (x !== 5);

document.getElementById("demo").innerHTML = "Result is " + result;
</script>

</body>
</html>
