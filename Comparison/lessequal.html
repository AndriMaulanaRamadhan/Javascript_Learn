<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Comparison</h1>
<h2>Less Than or Equal</h2>
<h2>The <= Operator</h2>

<p>Assign 5 to x, and display the value of the comparison (x <= 8).</p>

<p id="demo"></p>

<script>
let x = 5;
let result = (x <= 8);

document.getElementById("demo").innerHTML = "Result is " + result;
</script>

</body>
</html>
