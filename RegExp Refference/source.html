<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Regular Expressions</h2>

<p>The source property returns the text of a RegExp pattern:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools";
let pattern = /W3S/g;
let result = pattern.source;

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
