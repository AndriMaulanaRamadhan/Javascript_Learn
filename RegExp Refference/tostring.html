<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Regular Expressions</h2>

<p>toString() returns the string value of a RegExp object:</p>

<p id="demo"></p>

<script>
let pattern = new RegExp("Hello World", "g");
let text = pattern.toString();

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
