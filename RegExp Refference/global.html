<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The global Property</h2>

<p>The global property returns true if the /g flag is set, otherwise false:</p>

<p id="demo"></p>

<script>
let pattern = /W3S/g;
let result = pattern.global;

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
