<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The /m Flag</h2>

<p>The multiline property returns true if the /m flag is set, otherwise false:</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools!";
let pattern = /W3S/gi;
let result = pattern.multiline;

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
