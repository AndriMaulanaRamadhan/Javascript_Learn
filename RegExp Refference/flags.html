<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The flags Property</h2>
<p>The flag property returns the flags set in a regular expression.</p>

<p id="demo"></p>

<script>
const pattern = /W3Schools/gi;
let result = pattern.flags;

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
