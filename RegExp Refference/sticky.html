<!DOCTYPE html>
<html>
<body>
<h1>Regular Expressions</h1>
<h2>The sticky Property</h2>
<p>The sticky property returns true if the /y flag is set.</p>

<p id="demo"></p>

<script>
const pattern = /W3Schools/y;
let result = pattern.sticky;

document.getElementById("demo").innerHTML = result;
</script>

</body>
</html>
