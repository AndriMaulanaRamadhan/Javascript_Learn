<h1>Regular Expressions</h1>
<h2>The ignoreCase Property</h2>
<p>The ignoreCase property returns true if the /i flag is set.</p>

<p id="demo"></p>

<script>
let text = "Visit W3Schools!";
let pattern = /ws3/i;
let result = pattern.ignoreCase;
document.getElementById("demo").innerHTML = result;
</script>
