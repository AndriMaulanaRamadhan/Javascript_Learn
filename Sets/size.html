<!DOCTYPE html>
<html>
<body>
<h1>JavaScript Sets</h1>
<h2>The size Property</h2>
<p>The size property returns the number of elements in a set.</p>

<p id="demo"></p>

<script>
// Create a new Set
const letters = new Set(["a","b","c"]);

// Display the Size
document.getElementById("demo").innerHTML = "The set has " + letters.size + " elements.";
</script>

</body>
</html>
